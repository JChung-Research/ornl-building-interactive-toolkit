  system 3:
    campus*: BOPTEST
    building*: BESTEST-Air
    system*: bestest_air
    local timezone: US/Eastern
    building type: Small office
    operator: Mike
    image: https://digipedia.tudelft.nl/app/uploads/2024/06/HBRoomSetup_Image_00.jpg
    description: The building is a single room based on the BESTEST Case 900 model definition. The floor dimensions are 6m x 8m and the floor-to-ceiling height is 2.7m. There are four exterior walls facing the cardinal directions and a flat roof. The walls facing east-west have the short dimension. The south wall contains two windows, each 3m wide and 2m tall. The use of the building is assumed to be a two-person office with a light load density.
    zone point names*:
        supplyairsetpoint: SupplyAirSetpoint
        supplyfanspeed: SupplyFanSpeed
        zoneaircoolingsetpoint: ZoneAirCoolingSetpoint
        zoneairheatingsetpoint: ZoneAirHeatingSetpoint
    default setpoints:
        UnoccupiedHeatingSetPoint: 63
        UnoccupiedCoolingSetPoint: 80
        SupplyFanSpeed: 1
        SupplyAirSetpoint: 71
        ZoneAirCoolingSetpoint: 78
        ZoneAirHeatingSetpoint: 65
    schedule:
      monday:
        start: 8:00
        end: 18:00
      tuesday:
        start: 8:00
        end: 18:00
      wednesday:
        start: 8:00
        end: 18:00
      thursday:
        start: 8:00
        end: 18:00
      friday:
        start: 8:00
        end: 18:00
      saturday: always_off
      sunday: always_off
    chart configs:
      chart 1:
        chart type: line
        selected variables:
          variable 1: ZoneAirHeatingSetpoint
          variable 2: ZoneAirCoolingSetpoint
          variable 3: ZoneAirTemperature
        visualization setting:
          variable 1:
            color: red
            line width: 2
            line dash: dashdot
          variable 2:
            color: blue
            line width: 4
            line dash: dot
          variable 3:
            color: olive
            line width: 2
            line dash: solid
      chart 2:
        chart type: box
        selected variables:
          variable: ZoneAirTemperature
        visualization setting:
          occupied:
            color: purple
            line width: 2
            marker size: 6
          unoccupied:
            color: green
            line width: 2
            marker size: 6
      chart 3:
        chart type: scatter
        selected variables:
          variable x: HeatingPowerConsumption
          variable y: ZoneAirTemperature
        visualization setting:
          occupied:
            color: red
            marker size: 8
            marker symbol: diamond
          unoccupied:
            color: orange
            marker size: 9
            marker symbol: star

  system 4:
    campus*: BOPTEST
    building*: BESTEST-Hydronic
    system*: bestest_hydronic
    local timezone: US/Eastern
    building type: Small office
