    zone point names*:
        supplyheatersetpoint: SupplyHeaterSetpoint
        controlstagepump: ControlStagePump
        zoneoperativecoolingsetpoint: ZoneOperativeCoolingSetpoint
        zoneoperativeheatingsetpoint: ZoneOperativeHeatingSetpoint
    default setpoints:
        UnoccupiedHeatingSetPoint: 63
        UnoccupiedCoolingSetPoint: 80
        ControlStagePump: 1
        SupplyHeaterSetpoint: 71
        ZoneOperativeCoolingSetpoint: 78
        ZoneOperativeHeatingSetpoint: 65
    schedule:
      monday:
        start: 8:00
        end: 18:00
      tuesday:
        start: 8:00
        end: 18:00
      wednesday:
        start: 8:00
        end: 18:00
      thursday:
        start: 8:00
        end: 18:00
      friday:
        start: 8:00
        end: 18:00
      saturday: always_off
      sunday: always_off
    chart configs:
      chart 1:
        chart type: line
        selected variables:
          variable 1: ZoneOperativeHeatingSetpoint
          variable 2: ZoneOperativeCoolingSetpoint
          variable 3: HeatingPowerConsumption
        visualization setting:
          variable 1:
            color: red
            line width: 2
            line dash: dashdot
          variable 2:
            color: purple
            line width: 4
            line dash: solid
          variable 3:
            color: green
            line width: 2
            line dash: solid
      chart 2:
        chart type: scatter
        selected variables:
          variable x: HeatingPowerConsumption
          variable y: ZoneOperativeTemperature
        visualization setting:
          occupied:
            color: green
            marker size: 8
            marker symbol: cross
          unoccupied:
            color: blue
            marker size: 9
            marker symbol: hexagram
      chart 3:
        chart type: box
        selected variables:
          variable: ZoneOperativeTemperature
        visualization setting:
          occupied:
            color: green
            line width: 2
            marker size: 6
          unoccupied:
            color: purple
            line width: 2
            marker size: 6

