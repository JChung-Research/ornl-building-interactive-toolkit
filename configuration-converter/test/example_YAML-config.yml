  application title: ORBIT
  application description: 
  application api url: /api
  port: 2000
  application login: true

volttron:
  config directory path: "./"
  vip address: tcp://127.0.0.1:23921
  instance name: "central_frp"
  message bus: zmq

  agent info*: 
    agent 1:
      campus: BOPTEST
      id: bestest_air
      class: control_init
      url: http://api.boptest.net
      hearbeat period: 5
      data point:
        fcu_oveTSup_u:
          type: float
          units: K
          timezone: UTC
        fcu_oveFan_u:
          type: bool
          units: None
          timezone: UTC
        con_oveTSetCoo_u:
          type: float
          units: K
          timezone: UTC
        con_oveTSetHea_u:
          type: float
          units: K
          timezone: UTC
        fcu_reaFloSup_y:
          type: float
          units: kg/s
          timezone: UTC
        zon_reaCO2RooAir_y:
          type: float
          units: ppm
          timezone: UTC
        zon_reaTRooAir_y:
          type: float
          units: K
          timezone: UTC
        fcu_reaPFan_y:
          type: float
          units: W
          timezone: UTC
        fcu_reaPCoo_y:
          type: float
          units: W
          timezone: UTC
        fcu_reaPHea_y:
          type: float
          units: W
          timezone: UTC
    agent 2:
      campus: BOPTEST
      id: bestest_hydronic 
      class: control_init
      url: http://api.boptest.net
      hearbeat period: 5
      data point:
        oveTSetSup_u:
          type: float
          units: K
          timezone: UTC
        ovePum_u:
          type: bool
          units: None
          timezone: UTC
        oveTSetCoo_u:
          type: float
          units: K
          timezone: UTC
        oveTSetHea_u:
          type: float
          units: K
          timezone: UTC
        reaCO2RooAir_y:
          type: float
          units: ppm
          timezone: UTC
        reaTRoo_y:
          type: float
          units: K
          timezone: UTC
        reaPPum_y:
          type: float
          units: W
          timezone: UTC
        reaQHea_y:
          type: float
          units: W
          timezone: UTC
    agent 3:
      campus: ORNL
      id: "3147" 
      class: ecobee_init
      url: http://host.docker.internal:5005
      hearbeat period: 30
      data point:
        ZoneTemperature:
          type: float
          units: F
          timezone: UTC
        desiredHeat:
          type: float
          units: F
          timezone: UTC
        desiredCool:
          type: float
          units: F
          timezone: UTC
        HVACMode:
          type: bool
          units: None
          timezone: UTC