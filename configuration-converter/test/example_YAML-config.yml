building unit:
  config directory path: ./unit
  system 1:
    campus*: ORNL
    building*: "3147"
    system*: "102"
    local timezone: US/Eastern
    building type: Medium office
    operator: Mike
    image: https://digipedia.tudelft.nl/app/uploads/2024/06/HBRoomSetup_Image_00.jpg
    description: Building 3147 is a two-story office building with approximately 50 rooms located on the ORNL main campus.
    zone point names*:
        zoneairheatingsetpoint: ZoneAirHeatingSetpoint
        zoneaircoolingsetpoint: ZoneAirCoolingSetpoint
        hvacmode: HVACMode
    default setpoints:
        UnoccupiedHeatingSetPoint: 63
        UnoccupiedCoolingSetPoint: 80
        ZoneAirHeatingSetpoint: 65
        ZoneAirCoolingSetpoint: 78
        HVACMode: auto
    schedule:
      monday:
        start: 8:00
        end: 18:00
      tuesday:
        start: 8:00
        end: 18:00
      wednesday:
        start: 8:00
        end: 18:00
      thursday:
        start: 8:00
        end: 18:00
      friday:
        start: 8:00
        end: 18:00
      saturday: always_off
      sunday: always_off
    chart configs:
      chart 1:
        chart type: line
        selected variables:
          variable 1: ZoneAirHeatingSetpoint
          variable 2: ZoneAirCoolingSetpoint
          variable 3: ZoneAirTemperature
        visualization setting:
          variable 1:
            color: red
            line width: 2
            line dash: dashdot
          variable 2:
            color: blue
            line width: 4
            line dash: dot
          variable 3:
            color: olive
            line width: 4
            line dash: solid
