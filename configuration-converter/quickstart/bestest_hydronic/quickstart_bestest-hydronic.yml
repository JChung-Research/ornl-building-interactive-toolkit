building unit:
  config directory path: ./unit
  system 1:
    campus*: BOPTEST
    building*: BESTEST-Hydronic
    system*: bestest_hydronic
    local timezone: US/Eastern
    building type: Medium office
    operator: Rick
    image: https://digipedia.tudelft.nl/app/uploads/2024/06/HBRoomSetup_Image_00.jpg
    description: The building is a single room based on the BESTEST Case 900 model definition.
    zone point names*:
        supplyheatersetpoint: SupplyHeaterSetpoint
        controlstagepump: ControlStagePump
        zoneairheatingsetpoint: ZoneAirHeatingSetpoint
        zoneaircoolingsetpoint: ZoneAirCoolingSetpoint
    default setpoints:
        UnoccupiedHeatingSetPoint: 63
        UnoccupiedCoolingSetPoint: 80
        ControlStagePump: 1
        SupplyHeaterSetpoint: 71
        ZoneAirHeatingSetpoint: 65
        ZoneAirCoolingSetpoint: 78
    schedule:
      monday:
        start: 8:00
        end: 18:00
      tuesday:
        start: 8:00
        end: 18:00
      wednesday:
        start: 8:00
        end: 18:00
      thursday:
        start: 8:00
        end: 18:00
      friday:
        start: 8:00
        end: 18:00
      saturday: always_off
      sunday: always_off
    chart configs:
      chart 1:
        chart type: line
        selected variables:
          variable 1: ZoneAirHeatingSetpoint
          variable 2: ZoneAirCoolingSetpoint
          variable 3: ZoneAirTemperature
        visualization setting:
          variable 1:
            color: red
            line width: 2
            line dash: dashdot
          variable 2:
            color: blue
            line width: 4
            line dash: dot
          variable 3:
            color: olive
            line width: 4
            line dash: solid

