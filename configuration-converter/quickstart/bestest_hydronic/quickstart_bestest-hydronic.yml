  port: 2000
  application login: true

volttron:
  config directory path: "./"
  vip address: tcp://127.0.0.1:23921
  instance name: "central_frp"
  message bus: zmq

  agent info*: 
    agent 1:
      campus: BOPTEST
      id: bestest_hydronic 
      class: control_init
      url: http://api.boptest.net
      hearbeat period: 5
      data point:
        oveTSetSup_u:
          type: float
          units: K
          timezone: UTC
        ovePum_u:
          type: bool
          units: None
          timezone: UTC
        oveTSetCoo_u:
          type: float
          units: K
          timezone: UTC
        oveTSetHea_u:
          type: float
          units: K
          timezone: UTC
        reaCO2RooAir_y:
          type: float
          units: ppm
          timezone: UTC
        reaTRoo_y:
          type: float
          units: K
          timezone: UTC
        reaPPum_y:
          type: float
          units: W
          timezone: UTC
        reaQHea_y:
          type: float
          units: W
          timezone: UTC